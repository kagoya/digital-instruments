<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Digital Instruments</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;background:#151b18;font-family:Arial,'Noto Sans JP',sans-serif;color:#eef3ed}
main{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--stage-scale,0));transform-origin:center}
.instrument{width:100%;height:100%;padding:24px 4px 16px;display:flex;flex-direction:column;gap:20px;background:#29332f;overflow:hidden}
.instrument[data-instrument="trumpet"]{background:#363126}.instrument[data-instrument="flute"]{background:#29353b}.instrument[data-instrument="guitar"]{background:#392e28}
.controls{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 28px;flex:none;min-height:64px}
.controls label{display:flex;align-items:center;gap:16px;font-size:21px;color:#bdcbbf;white-space:nowrap}
#note{font:40px Georgia,serif;color:#d4e6ce;min-width:88px}
.indicator{font-size:18px;color:#aebdae;flex:1}.indicator:before{content:'●';color:#b4cbb6;margin-right:12px}
select,.controls button{font:22px Arial;color:#e5e8df;background:#35453b;border:1px solid #718574;border-radius:12px;padding:14px 20px;cursor:pointer}
.controls button[aria-pressed=true]{background:#b4cbb6;color:#233129}
.controls input{width:180px;accent-color:#b2cab3}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #cfab6c;outline-offset:3px}
.instrument-art{flex:0 0 310px;min-height:0;margin:0 auto;width:100%;max-width:1100px}
.instrument-art[hidden]{display:none}
.instrument-art svg{display:block;width:100%;height:100%;filter:drop-shadow(0 12px 10px #0004)}
.instrument-art .sounding{opacity:0;transition:opacity .12s}.instrument-art.playing .sounding{opacity:.8}
.keyboard-scroll{flex:1;min-height:0;overflow:hidden;padding-bottom:8px}
.keyboard{position:relative;display:flex;width:100%;height:100%;touch-action:none}
.key{border:0;cursor:pointer;user-select:none;touch-action:none;font-family:inherit}
.white{flex:1;min-width:0;position:relative;background:linear-gradient(#fffefa,#eeece4);border:1px solid #d4d2c8;border-radius:0 0 8px 8px;box-shadow:inset 0 -9px #dcdad0}
.white.active{background:#bcd3bb;box-shadow:inset 0 -4px #93ad95}
.black{position:absolute;width:4.4%;height:61%;z-index:2;background:linear-gradient(90deg,#161d1a,#37413b,#19221d);border-radius:0 0 6px 6px;box-shadow:0 7px 7px #0005,inset 0 -10px #111814}
.black.active{background:#6c8f74;box-shadow:inset 0 -4px #4b7056}
.key .labels{position:absolute;bottom:30px;left:0;right:0;display:flex;flex-direction:column;gap:15px;align-items:center;font-size:19px;color:#788375}
.key kbd{font:22px Arial;color:#586551}
.black .labels{bottom:22px;color:#afc1b5}.black kbd{color:#b1bdb3}
.under{flex:none;display:flex;justify-content:space-between;padding:0 24px;font-size:15px;letter-spacing:1px;color:#9aa89e}
.instrument:not([data-instrument="piano"]) .keyboard{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;padding:8px 12px}
.instrument:not([data-instrument="piano"]) .key{position:relative;left:auto!important;width:100%;height:100%;min-height:0;border-radius:50%;background:linear-gradient(135deg,#ffe4a1,#9b7234);box-shadow:inset 0 0 0 4px #ead39966,0 4px #171914;border:1px solid #cab176}
.instrument:not([data-instrument="piano"]) .key .labels{position:static;gap:10px;color:#312d22}
.instrument:not([data-instrument="piano"]) .key kbd{color:inherit;opacity:.7}
.instrument:not([data-instrument="piano"]) .key.active{background:#d4ebc2;box-shadow:0 0 24px #c4e5ac77;transform:translateY(2px)}
.instrument[data-instrument="flute"] .key{background:linear-gradient(135deg,#f4fbff,#879aa4);border-color:#c0d0d7}
.instrument[data-instrument="guitar"] .keyboard{background:repeating-linear-gradient(0deg,transparent 0 44px,#c8a371 45px 46px,transparent 47px 90px);border-radius:8px}
.instrument[data-instrument="guitar"] .key{border-radius:8px;background:#785335;border-color:#a17b54;box-shadow:inset -4px 0 #c4b6a4,0 4px #221912}
.instrument[data-instrument="guitar"] .key .labels{color:#fff2dd}
.instrument[data-instrument="guitar"] .key.active{background:#8baf7f}
</style></head><body><main aria-label="デジタル楽器"><section class="instrument" id="instrument-panel" data-instrument="piano" aria-label="ピアノ"><div class="controls"><output id="note" aria-label="演奏中の音">—</output><span class="indicator" id="status" role="status">演奏をはじめましょう</span><label>音色 <select id="instrument" aria-label="楽器の音色"><option value="piano">ピアノ</option><option value="trumpet">トランペット</option><option value="flute">フルート</option><option value="guitar">ギター</option></select></label><label>音量 <input id="volume" aria-label="音量" type="range" min="0" max="100" value="65"></label><button id="sustain" aria-pressed="false">サステイン OFF</button></div><div id="instrument-art" class="instrument-art" aria-hidden="true" hidden></div><div class="keyboard-scroll"><div id="keyboard" class="keyboard"></div></div><div class="under"><span>C4 — C6 · 2 OCTAVES</span><span>クリック・タッチ・キーボードで演奏</span></div></section></main><script>
function fitStage(){
  const viewport=window.visualViewport;
  const width=viewport?viewport.width:window.innerWidth;
  const height=viewport?viewport.height:window.innerHeight;
  document.documentElement.style.setProperty('--stage-scale',Math.min(width/1600,height/900));
}
fitStage();
window.addEventListener('resize',fitStage);
window.visualViewport?.addEventListener('resize',fitStage);
for(const type of ['gesturestart','gesturechange','gestureend']){
  document.addEventListener(type,event=>event.preventDefault(),{passive:false});
}
document.addEventListener('wheel',event=>event.preventDefault(),{passive:false});
document.addEventListener('touchmove',event=>event.preventDefault(),{passive:false});
</script><script src="piano.js"></script></body></html>
